version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: integra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-integra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integra}
      POSTGRES_DB: ${POSTGRES_DB:-integra_sys}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: integra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: integra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fiscal-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-integra}:${POSTGRES_PASSWORD:-integra}@postgres:5432/${POSTGRES_DB:-integra_sys}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      FISCAL_SERVICE_URL: http://fiscal-service:3334
      FISCAL_INTERNAL_KEY: ${FISCAL_INTERNAL_KEY}
    ports:
      - "3333:3333"

  fiscal-service:
    build:
      context: apps/fiscal-service
      dockerfile: Dockerfile
    container_name: integra-fiscal-service
    restart: unless-stopped
    environment:
      FISCAL_SERVICE_PORT: 3334
      FISCAL_INTERNAL_KEY: ${FISCAL_INTERNAL_KEY}
      FISCAL_STORAGE_PATH: /app/storage
      FISCAL_DEFAULT_ENVIRONMENT: ${FISCAL_DEFAULT_ENVIRONMENT:-homologation}
      FISCAL_ENCRYPTION_KEY: ${FISCAL_ENCRYPTION_KEY}
    volumes:
      - fiscal-storage:/app/storage
    ports:
      - "3334:3334"

  web-saas:
    build:
      context: .
      dockerfile: apps/web-saas/Dockerfile
    container_name: integra-web-saas
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api/v1}
    ports:
      - "3000:3000"

  admin-master:
    build:
      context: .
      dockerfile: apps/admin-master/Dockerfile
    container_name: integra-admin-master
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api/v1}
    ports:
      - "3001:3001"

volumes:
  postgres-data:
  redis-data:
  fiscal-storage:
